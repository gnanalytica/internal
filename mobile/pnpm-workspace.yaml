# Marks mobile/ as its own pnpm workspace root.
#
# Without this file pnpm walks UP from mobile/, finds the repo-root
# pnpm-workspace.yaml, and installs there instead. mobile/ is not a member of
# that workspace, so its dependencies never land — and the install still exits 0.
# The failure surfaces much later and confusingly: `expo/tsconfig.base` missing
# for tsc, and "The `expo` package was not found" from EAS Build.
#
# This file stops the upward walk, so a plain `pnpm install` inside mobile/ does
# the right thing everywhere — local, GitHub Actions, and EAS Build (which runs
# its own install we cannot pass flags to).
#
# Empty on purpose: mobile/ is a single standalone project, not a workspace with
# members. Do not delete this file.
packages: []
